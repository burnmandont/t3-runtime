name: Build sovereign Apple clients

on:
  repository_dispatch:
    types:
      - sovereign_apple_release
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA from the Gitea sovereign repository
        required: true
        type: string
      desktop_version:
        description: Immutable desktop SemVer derived by sovereign CI
        required: true
        type: string

concurrency:
  group: sovereign-apple-${{ github.event.client_payload.commit_sha || inputs.commit_sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_REPOSITORY_URL: git@source.moondiner.com:t3_fork/sovereign.git
  SOURCE_KNOWN_HOST: source.moondiner.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPzyGx1uSYb6xaps6hfR1YKWkE9oDfFLBDxv+xiTMITD
  SOURCE_SHA: ${{ github.event.client_payload.commit_sha || inputs.commit_sha }}
  DESKTOP_VERSION: ${{ github.event.client_payload.desktop_version || inputs.desktop_version }}

jobs:
  validate-config:
    name: Validate release configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      GITEA_DEPLOY_KEY: ${{ secrets.GITEA_DEPLOY_KEY }}
    steps:
      - name: Validate immutable release identity and signing configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          missing=false
          for name in \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            APPLE_API_KEY \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            GITEA_DEPLOY_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions configuration: $name" >&2
              missing=true
            fi
          done
          test "$missing" = false

  build-desktop:
    name: Build macOS ${{ matrix.arch }}
    needs: validate-config
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
          - arch: x64
            rust_target: x86_64-apple-darwin
    steps:
      - name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Configure read-only Gitea deploy key
        shell: bash
        env:
          GITEA_DEPLOY_KEY: ${{ secrets.GITEA_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/gitea-deploy-key"
          known_hosts_path="$RUNNER_TEMP/gitea-known-hosts"
          printf '%s\n' "$GITEA_DEPLOY_KEY" > "$key_path"
          printf '%s\n' "$SOURCE_KNOWN_HOST" > "$known_hosts_path"
          chmod 600 "$key_path" "$known_hosts_path"
          printf 'GIT_SSH_COMMAND=/usr/bin/ssh -i %q -o IdentitiesOnly=yes -o UserKnownHostsFile=%q\n' \
            "$key_path" "$known_hosts_path" >> "$GITHUB_ENV"

      - name: Fetch exact source from Gitea
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$SOURCE_REPOSITORY_URL"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Prepare Apple signing material
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_CONTENT"
          test -n "$APPLE_API_KEY_ID_VALUE"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_VALUE}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          printf 'APPLE_API_KEY=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized desktop artifact
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_OAUTH_ISSUER: https://auth.moondiner.com/api/auth
          T3CODE_OAUTH_CLIENT_ID: t3-code
          T3CODE_OAUTH_RESOURCE: https://relay.moondiner.com
          T3CODE_RELAY_URL: https://relay.moondiner.com
          T3CODE_HOSTED_APP_URL: https://code.moondiner.com
          T3CODE_CLERK_PUBLISHABLE_KEY: ""
          T3CODE_CLERK_JWT_TEMPLATE: ""
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ""
          VITE_HOSTED_APP_URL: https://code.moondiner.com
          VITE_HOSTED_APP_CHANNEL: sovereign
          VITE_REMOTE_FAVICONS: "0"
          T3CODE_WEB_SOURCEMAP: "0"
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$T3CODE_DESKTOP_UPDATE_REPOSITORY"
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch "${{ matrix.arch }}" \
            --build-version "$DESKTOP_VERSION" \
            --signed \
            --verbose

      - name: Verify notarized artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          test "${#dmgs[@]}" -gt 0
          for dmg in "${dmgs[@]}"; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          done

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in release/*.dmg release/*.zip release/*.blockmap release/*.yml; do
            for file in $pattern; do cp "$file" release-publish/; done
          done
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-x64.yml"
            done
          fi

      - name: Upload desktop assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  publish-desktop:
    name: Publish desktop update
    needs: build-desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Configure read-only Gitea deploy key
        shell: bash
        env:
          GITEA_DEPLOY_KEY: ${{ secrets.GITEA_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/gitea-deploy-key"
          known_hosts_path="$RUNNER_TEMP/gitea-known-hosts"
          printf '%s\n' "$GITEA_DEPLOY_KEY" > "$key_path"
          printf '%s\n' "$SOURCE_KNOWN_HOST" > "$known_hosts_path"
          chmod 600 "$key_path" "$known_hosts_path"
          printf 'GIT_SSH_COMMAND=/usr/bin/ssh -i %q -o IdentitiesOnly=yes -o UserKnownHostsFile=%q\n' \
            "$key_path" "$known_hosts_path" >> "$GITHUB_ENV"

      - name: Fetch exact release helpers from Gitea
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$SOURCE_REPOSITORY_URL"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download desktop assets
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-mac-*
          merge-multiple: true
          path: release-assets

      - name: Merge updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=false
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            test -f "$arm64_manifest"
            node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
            rm "$x64_manifest"
            found=true
          done
          test "$found" = true

      - name: Publish immutable desktop release
        env:
          SOVEREIGN_GITHUB_REPOSITORY: ${{ github.repository }}
          SOVEREIGN_GITHUB_TOKEN: ${{ github.token }}
          SOVEREIGN_DESKTOP_VERSION: ${{ env.DESKTOP_VERSION }}
          SOVEREIGN_DESKTOP_OUTPUT_DIR: release-assets
        run: node infra/sovereign/ci/publish-desktop-release.mjs
